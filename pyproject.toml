[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumfetcher"
version = "1.1.1"
description = "Tool for fetching Quantum Break live action episodes for offline in-game playback"
authors = [
    {name = "Marek Grzyb",email = "marek@grzyb.dev"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
]
requires-python = ">=3.14"
dependencies = [
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[tool.uv]
package = true

[project.scripts]
quantumfetcher = "quantumfetcher.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

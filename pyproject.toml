[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumfetcher"
version = "2.0.2"
description = "Tool for fetching Quantum Break live action episodes for offline in-game playback"
authors = [
    {name = "Marek Grzyb",email = "marek@grzyb.dev"}
]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
]
requires-python = ">=3.14"
dependencies = [
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[tool.uv]
package = true

[project.scripts]
quantumfetcher = "quantumfetcher.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "prompt-toolkit>=3.0.53",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF", "TID251", "D"]
# Modules and types need a docstring only when their name does not tell their role, and magic
# methods keep the meaning Python gives them.
ignore = ["D100", "D101", "D104", "D105", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"quantumfetcher.choice".msg = "Only the command line modules use the terminal."
"quantumfetcher.cli".msg = "Only the command line modules use the terminal."
"quantumfetcher.prompts".msg = "Only the command line modules use the terminal."
"questionary".msg = "Only the command line modules use the terminal."
"rich".msg = "Only the command line modules use the terminal."
"typer".msg = "Only the command line modules use the terminal."

[tool.ruff.lint.per-file-ignores]
"src/quantumfetcher/{__main__,choice,cli,prompts}.py" = ["TID251"]
"tests/**" = ["TID251"]
# Test names say what each test proves.
"tests/test_*.py" = ["D"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib"]
strict = true

[tool.mypy]
strict = true
files = ["src", "tests"]
